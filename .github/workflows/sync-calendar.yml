name: Sync Airbnb Calendar

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-calendar
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch and sanitize Airbnb iCal feed
        run: |
          curl -fsSL -A "Mozilla/5.0" \
            "https://www.airbnb.co.uk/calendar/ical/47932092.ics?s=757cdc5b22f78dba4544db7dc22c922d" \
            | tr -d '\r' \
            | awk '
              /^DESCRIPTION:/ { skip = 1; next }
              skip && /^[ \t]/ { next }
              { skip = 0; print }
            ' > public/availability.ics.tmp

          grep -q "BEGIN:VCALENDAR" public/availability.ics.tmp
          grep -q "END:VCALENDAR" public/availability.ics.tmp

      - name: Commit updated calendar and trigger site deploy if changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f public/availability.ics ] || ! diff -u \
            <(grep -v '^DTSTAMP:' public/availability.ics) \
            <(grep -v '^DTSTAMP:' public/availability.ics.tmp) > /dev/null; then
            mv public/availability.ics.tmp public/availability.ics
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/availability.ics
            git commit -m "chore: sync Airbnb availability calendar"
            git push
            gh workflow run deploy.yml --ref "${{ github.ref_name }}"
          else
            rm -f public/availability.ics.tmp
            echo "No booking changes detected in Airbnb calendar."
          fi
