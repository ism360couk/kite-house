name: Sync Airbnb Calendar

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-calendar
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch and sanitize Airbnb iCal feed
        run: |
          curl -fsSL --compressed -A "Mozilla/5.0" \
            "https://www.airbnb.co.uk/calendar/ical/47932092.ics?s=757cdc5b22f78dba4544db7dc22c922d" \
            | tr -d '\r' \
            | awk '
              /^DESCRIPTION:/ { skip = 1; next }
              skip && /^[ \t]/ { next }
              { skip = 0; print }
            ' > public/availability.ics.tmp

          grep -q "BEGIN:VCALENDAR" public/availability.ics.tmp
          grep -q "END:VCALENDAR" public/availability.ics.tmp
          mv public/availability.ics.tmp public/availability.ics

          SYNCED_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          printf '{\n  "syncedAt": "%s"\n}\n' "$SYNCED_AT" > public/calendar-sync.json

      - name: Commit synced calendar and timestamp
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/availability.ics public/calendar-sync.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync Airbnb availability calendar"
            git push
          else
            echo "No changes to commit."
          fi
